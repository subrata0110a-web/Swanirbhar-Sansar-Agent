name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Copy web assets manually
        run: |
          mkdir -p android/app/src/main/assets/public
          cp Agent.html android/app/src/main/assets/public/index.html
          cp location-sw.js android/app/src/main/assets/public/location-sw.js
          echo '{"plugins":{}}' > android/app/src/main/assets/capacitor.plugins.json

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Replace AndroidManifest.xml
        run: cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: swanirbhar-agent-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
